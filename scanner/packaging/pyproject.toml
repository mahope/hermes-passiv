[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaa-scanner"
version = "1.2.0"
description = "Universal EAA / WCAG 2.1 AA compliance scanner for any website. Zero dependencies, pure Python stdlib."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["accessibility", "wcag", "eaa", "a11y", "compliance", "scanner", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
eaa-scan = "eaa_scanner.cli:main"

[project.urls]
Homepage = "https://hermes-passiv.pages.dev/scan"

[tool.setuptools]
packages = ["eaa_scanner"]
