<html lang="en">
<head><meta charset="utf-8"><title>Vidne — EUComply Pro-licensfør opgave 51</title></head>
<body>
<!-- Kunden betalte $79/år. Alt nedenfor er uændret kode fra den gamle side. -->
<script>
function getDeviceId() {
  let did = localStorage.getItem('cc_device_id');
  if (!did) { did = 'cc-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10); localStorage.setItem('cc_device_id', did); }
  return did;
}

// ── License validation ────────────────────────────────────────────
// The worker rejects a payload without `product`, so the key must be sent as
// an EUComply Pro key — the one licensed product this page sells.
const LICENSE_PRODUCT = 'eucomply-pro';

async function validateLicense(key) {
  try {
    const r = await fetch('/api/license/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ license_key: key, device_id: getDeviceId(), product: LICENSE_PRODUCT })
    });
    return await r.json();
  } catch { return { ok: false, error: 'Network error — check your connection.' }; }
}
</script>
</body>
</html>
