name: Build DeskUptime Desktop

on:
  push:
    paths:
      - deskuptime/desktop/**
      - .github/workflows/build-deskuptime-desktop.yml
    tags:
      - 'deskuptime-desktop-v*'
  pull_request:
    paths:
      - deskuptime/desktop/**
    branches: [main]

permissions:
  contents: write

env:
  PACKAGE_DIR: deskuptime/desktop

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PACKAGE_DIR }}/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-${{ matrix.arch }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', env.PACKAGE_DIR)) }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build for ${{ matrix.arch }}
        run: |
          cd ${{ env.PACKAGE_DIR }}
          rustup target add ${{ matrix.arch }}
          cargo tauri build --bundles dmg --ci --target ${{ matrix.arch }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: deskuptime-macos-${{ matrix.arch }}
          path: ${{ env.PACKAGE_DIR }}/src-tauri/target/${{ matrix.arch }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: deskuptime-macos-${{ matrix.arch }}-zip
          path: ${{ env.PACKAGE_DIR }}/src-tauri/target/${{ matrix.arch }}/release/bundle/macos/*.zip
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PACKAGE_DIR }}/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', env.PACKAGE_DIR)) }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build (Linux)
        run: |
          cd ${{ env.PACKAGE_DIR }}
          cargo tauri build --bundles appimage,deb --ci

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: deskuptime-linux-appimage
          path: ${{ env.PACKAGE_DIR }}/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: deskuptime-linux-deb
          path: ${{ env.PACKAGE_DIR }}/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/deskuptime-desktop-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Tag name
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "DeskUptime Desktop $TAG" \
            --notes "Auto-built by CI — macOS (Intel + Apple Silicon), Linux (AppImage + deb)" \
            artifacts/*