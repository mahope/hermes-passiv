name: deploy-sites

# Bygger dist/<domæne> med build_sites.py og deployer hvert produktsite til sit
# Cloudflare Pages-projekt ved push på main. build_sites.py henter deskuptime-
# værktøjssider fra auditedwp-repoet, som derfor checkes ud ved siden af.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'bugbottle-landing/**'
      - 'build_sites.py'
      - 'tools/brand.py'
      - 'tools/pagepass.py'
      - 'tools/route_inventory.py'
      - 'tools/route_inventory.json'
      - 'tools/check_sitemaps.py'
      - 'tools/check_live_sitemaps.py'
      - 'tools/test_check_sitemaps.py'
      - 'tools/test_check_live_sitemaps.py'
      - 'tools/seo_check.py'
      - 'tools/check_inline_js.py'
      - 'tests/stripe-worker.test.mjs'
      - '.github/workflows/deploy-sites.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: cleancopy.tools
            project: cleancopy-tools
          - domain: deskuptime.com
            project: deskuptime
          - domain: mahope.tools
            project: mahope-tools
    concurrency:
      group: pages-${{ matrix.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build_sites.py læser datePublished/dateModified fra git-historikken

      - uses: actions/checkout@v4
        with:
          repository: mahope/auditedwp
          ref: 5e244dcff242352cd5be31a55ca5f7d260f7e520
          path: auditedwp-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Byg dist/${{ matrix.domain }}
        env:
          AUDITEDWP_DIR: ${{ github.workspace }}/auditedwp-src
        run: |
          set -o pipefail
          python3 tools/test_check_sitemaps.py
          python3 tools/test_check_live_sitemaps.py
          python build_sites.py --only "${{ matrix.domain }}" | tee build.log
          python tools/seo_check.py --only "${{ matrix.domain }}"
          python tools/check_sitemaps.py --only "${{ matrix.domain }}"
          node tests/stripe-worker.test.mjs
          python tools/check_inline_js.py
          if grep -q "extra file missing" build.log; then
            echo "FEJL: build_sites.py manglede en extra-fil (auditedwp-checkout?)"
            exit 1
          fi
          test -f "dist/${{ matrix.domain }}/index.html"

      - name: Deploy til Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dist/${{ matrix.domain }}
          command: pages deploy . --project-name ${{ matrix.project }} --branch main --commit-dirty=true

      - name: Tjek produktion
        run: python3 tools/check_live_sitemaps.py --only "${{ matrix.domain }}" --commit "$GITHUB_SHA"
