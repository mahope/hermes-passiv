name: deploy-sites

# Bygger dist/<domæne> med build_sites.py og deployer hvert produktsite til sit
# Cloudflare Pages-projekt ved push på main. build_sites.py henter deskuptime-
# værktøjssider fra auditedwp-repoet, som derfor checkes ud ved siden af.

on:
  push:
    branches: [main]
    paths:
      # Bemærk: listen er ikke håndskrevet ukritisk. `tools/quality_gate.py`
      # erklærer, hvilke filer hvert gatestep læser, og
      # `tools/test_deploy_workflow.py` fejler hvis et af dem mangler her. Se
      # `python3 tools/quality_gate.py --inputs` for den afledte liste.
      - 'site/**'
      - 'bugbottle-landing/**'
      - 'build_sites.py'
      - 'tools/brand.py'
      - 'tools/pagepass.py'
      - 'tools/route_inventory.py'
      - 'tools/route_inventory.json'
      - 'tools/check_sitemaps.py'
      - 'tools/check_live_sitemaps.py'
      - 'tools/test_check_sitemaps.py'
      - 'tools/test_check_live_sitemaps.py'
      - 'tools/seo_check.py'
      - 'tools/check_inline_js.py'
      - 'tools/check_private_content.py'
      - 'tools/check_page_profile_distribution.py'
      - 'tools/check_license_clients.py'
      - 'tools/check_clean_copy_distribution.py'
      - 'tools/check_links.py'
      - 'tools/build_clean_copy_archives.py'
      - 'tools/check_product_copy.py'
      - 'tools/check_stripe_ctas.py'
      - 'tools/stripe_catalog.json'
      - 'tools/make_blog_da_mirrors_461.py'
      - 'tools/quality_gate.py'
      - 'tools/mini_yaml.py'
      - 'tools/mini_toml.py'
      - 'tools/check_python_env.py'
      - 'tools/lock_python_env.py'
      - 'tools/check_versions.py'
      # `check_legacy_seo_paths` læser hvert .py/.sh i roden og i tools/ — de
      # skal kunne ramme den døde kilde-sitemap eller den døde vært, så de er
      # input til gaten og dermed til filteret.
      - '*.py'
      - '*.sh'
      - 'tools/*.py'
      - 'tools/*.sh'
      - 'tools/check_legacy_seo_paths.py'
      - 'requirements-build.txt'
      - 'requirements-audit.txt'
      - 'site-icons/pyproject.toml'
      # Opgave 20: hele `site-icons/` er input til `build_site_icons_archive.py`,
      # fordi de publicerede filer er en regeneration af kilden. Uden hele
      # familien ville en commit der kun retter `site_icons.py` merge uden at
      # nogen læste det publicerede arkiv — præcis det hullet opgave 18 måtte
      # oplyse for `desktop/**`, og det er lukket her i stedet for at blive noteret.
      # `site/downloads/site-icons/**` dækkes allerede af `site/**` ovenfor, så
      # der står ingen overflødige linjer for filteret at vedligeholde.
      - 'site-icons/**'
      # Én versionskilde pr. produkt: en ændring i en af disse skal kunne
      # udløse gaten, der fortæller om resten af versionerne stadig er i takt.
      # `desktop/package.json` er bevidst IKKE med: `test_deploy_workflow`
      # forbyder at en desktop-ændring deployer sites, fordi desktop udgives
      # af `build-desktop.yml`. Se `RESULT` (opgave 14) om det hullet.
      - 'scanner/**'
      - 'manifest.json'
      - 'versions.json'
      - 'tools/test_license_flow.js'
      - 'extension-clean-copy/**'
      - 'extension-clean-copy-firefox/**'
      - 'obsidian-plugin/**'
      - 'site/extension-zips/**'
      - 'tools/clean_copy_license.js'
      - 'tools/test_license_clients.js'
      - 'tools/paid_content.json'
      - 'page-profile/**'
      - 'site/downloads/page-profile/**'
      - 'tools/add_tracking.py'
      - 'tools/weekly_report.py'
      - 'tools/test_weekly_report.py'
      - 'tools/test_deploy_workflow.py'
      - 'tests/stripe-worker.test.mjs'
      - 'tests/tracking-worker.test.mjs'
      - 'test.js'
      # Licenskatalogen og kontrakten definerer priserne; `products/` er de
      # betalte filer `check_private_content.py` holder ude af dist.
      - 'docs/**'
      - 'products/**'
      # `check_license_clients.py` har `desktop/main.js` som dokumenteret
      # undtagelse. Kun den ene fil, så en desktop-ændring ikke deployer sites.
      - 'desktop/main.js'
      - '.github/workflows/deploy-sites.yml'
      # `tools/test_deploy_workflow.py` læser begge workflows, og
      # `build-desktop.yml` kører ingen gate selv — så uden denne linje ville
      # enændring af desktop-workflowen aldrig blive gaten afkontrolleret.
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  # Den fulde kvalitetsgate, ét sted, før noget deployes.
  #
  # Før denne opgave kørte hvert matrixjob sin egen, kortere liste, og tre af
  # de dokumenterede checks kørte aldrig i CI. Tre separate lister kan ikke
  # bevise, at de er ens — én kan. `tools/quality_gate.py` ejer listen, og
  # `tools/test_deploy_workflow.py` (et step i gaten selv) beviser bagefter at
  # path-filteret dækker hver fil listen læser.
  #
  # Den bygger alle fire dists, fordi `check_clean_copy_distribution.py` skal
  # vide hvilket domæne der publicerer hvilket arkiv, og `check_links.py` skal
  # opløse krydsdomæne-links mod det domænes dist — begge kan det kun se i et
  # dist der er bygget. Deploy afhænger af dette job, så en fælles gatefejl
  # dræber alle tre deploys i stedet for at sende dem videre hver for sig.
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build_sites.py læser datePublished/dateModified fra git-historikken

      - uses: actions/checkout@v4
        with:
          repository: mahope/auditedwp
          ref: 5e244dcff242352cd5be31a55ca5f7d260f7e520
          path: auditedwp-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kør hele kvalitetsgaten
        env:
          AUDITEDWP_DIR: ${{ github.workspace }}/auditedwp-src
        run: |
          set -o pipefail
          python3 tools/quality_gate.py

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: cleancopy.tools
            project: cleancopy-tools
          - domain: deskuptime.com
            project: deskuptime
          - domain: mahope.tools
            project: mahope-tools
    concurrency:
      group: pages-${{ matrix.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build_sites.py læser datePublished/dateModified fra git-historikken

      - uses: actions/checkout@v4
        with:
          repository: mahope/auditedwp
          ref: 5e244dcff242352cd5be31a55ca5f7d260f7e520
          path: auditedwp-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Gaten kørte i `gate`-jobbet over alle fire domæner. Her bygges kun det
      # domæne der skal deployes, og resten er bevis på at bygget virkede.
      - name: Byg dist/${{ matrix.domain }}
        env:
          AUDITEDWP_DIR: ${{ github.workspace }}/auditedwp-src
        run: |
          set -o pipefail
          python build_sites.py --only "${{ matrix.domain }}" | tee build.log
          if grep -q "extra file missing" build.log; then
            echo "FEJL: build_sites.py manglede en extra-fil (auditedwp-checkout?)"
            exit 1
          fi
          test -f "dist/${{ matrix.domain }}/index.html"

      - name: Deploy til Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: pages deploy dist/${{ matrix.domain }} --project-name ${{ matrix.project }} --branch main --commit-dirty=true

      - name: Tjek produktion
        run: python3 tools/check_live_sitemaps.py --only "${{ matrix.domain }}" --commit "$GITHUB_SHA"
