[project]
name = "site-icons"
version = "1.0.0"
description = "Generate favicons, OG images, PWA icons, and web app manifest from a single SVG/PNG source"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0",
]
license = "MIT"
keywords = ["favicon", "og-image", "pwa", "icon", "web", "cli"]

[project.urls]
Homepage = "https://mahope.tools/site-icons"
Repository = "https://github.com/mahope/hermes-passiv"

[project.scripts]
site-icons = "site_icons:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# `site_icons.py` er et fladt modul, ikke en pakke: der er ingen
# `site_icons/__init__.py`. `packages.find` fandt derfor ingenting, så selv et
# korrekt `[project]`-manifest ville have bygget et hjælpeløst tomt hjul.
[tool.setuptools]
py-modules = ["site_icons"]
