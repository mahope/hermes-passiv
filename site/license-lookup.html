<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retrieve your Clean Copy Pro license key</title>
  <meta name="description" content="Lost your Clean Copy Pro license key? Enter the order id from your Lemon Squeezy receipt and the email you bought with to retrieve it.">
  <meta property="og:title" content="Retrieve your Clean Copy Pro license key">
  <meta property="og:description" content="Enter your order id and email to get your Clean Copy Pro license key back.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hermes-passiv.pages.dev/license-lookup">
  <link rel="canonical" href="https://hermes-passiv.pages.dev/license-lookup">
  <link rel="alternate" hreflang="x-default" href="https://hermes-passiv.pages.dev/license-lookup">
  <link rel="stylesheet" href="/style.css">
  <style>
    .lookup-wrap { max-width: 560px; margin: 0 auto; padding: 2rem 1rem; }
    .lookup-card {
      background: var(--color-surface-2, #f8fafc);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 1.6rem 1.6rem 1.4rem;
      margin-top: 1.5rem;
    }
    .lookup-card label { display: block; font-weight: 600; margin: 0.9rem 0 0.35rem; }
    .lookup-card input {
      width: 100%; box-sizing: border-box;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--color-border); border-radius: 8px;
      background: var(--color-surface); color: var(--color-text);
      font-family: 'SF Mono', 'Monaco', monospace; font-size: 0.88rem;
    }
    .lookup-card button { margin-top: 1.2rem; }
    #lookup-status { font-size: 0.9rem; margin-top: 0.9rem; }
    #lookup-status.ok { color: #16a34a; }
    #lookup-status.err { color: #dc2626; }
    .key-box {
      margin-top: 0.8rem; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center;
    }
    .key-box code {
      flex: 1; min-width: 200px; word-break: break-all;
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: 8px; padding: 0.6rem 0.75rem;
      font-family: 'SF Mono', 'Monaco', monospace; font-size: 0.85rem;
    }
    .hint { color: var(--color-text-muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main class="lookup-wrap">
    <h1>Retrieve your license key</h1>
    <p class="hint">Bought Clean Copy Pro and lost the key? Enter the <strong>order id</strong>
    from your Lemon Squeezy receipt (looks like <code>123456</code>) and the
    <strong>email address</strong> you paid with, and we'll show it again.</p>

    <div class="lookup-card">
      <form id="lookup-form">
        <label for="order-id">Order id</label>
        <input type="text" id="order-id" name="order_id" autocomplete="off" required
               placeholder="e.g. 482913" aria-describedby="lookup-status">
        <label for="email">Email used at purchase</label>
        <input type="email" id="email" name="email" autocomplete="email" required
               placeholder="you@example.com" aria-describedby="lookup-status">
        <button type="submit" class="btn-primary">Find my key</button>
      </form>
      <p id="lookup-status" role="status" aria-live="polite"></p>
      <div class="key-box" id="key-box" hidden>
        <code id="key-value"></code>
        <button type="button" class="btn-secondary" id="btn-copy-key">Copy key</button>
      </div>
      <p id="expiry-line" class="hint" hidden></p>
    </div>

    <p style="margin-top:1.5rem;">
      Have your key already? <a href="/clean-copy-tool#pro-activate-details">Activate Pro here →</a>
    </p>
    <footer style="text-align:center;padding:2rem 1rem;color:var(--color-text-muted);font-size:0.85rem;">
      <a href="/clean-copy-tool">Clean Copy Web</a> · <a href="/clean-copy">Clean Copy extension</a> · by Passiv
    </footer>
  </main>
  <script>
    var form = document.getElementById('lookup-form');
    var statusEl = document.getElementById('lookup-status');
    var keyBox = document.getElementById('key-box');
    var keyValue = document.getElementById('key-value');
    var expiryLine = document.getElementById('expiry-line');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      statusEl.textContent = 'Looking…';
      statusEl.className = '';
      keyBox.hidden = true;
      expiryLine.hidden = true;
      fetch('/api/license/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          order_id: document.getElementById('order-id').value.trim(),
          email: document.getElementById('email').value.trim()
        })
      }).then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
        .then(function (res) {
          if (res.s === 200 && res.j.ok) {
            keyValue.textContent = res.j.license_key;
            keyBox.hidden = false;
            expiryLine.textContent = res.j.expires_at
              ? 'Valid until ' + res.j.expires_at.slice(0, 10) + '.'
              : '';
            expiryLine.hidden = !res.j.expires_at;
            statusEl.textContent = 'Found it — copy the key below.';
            statusEl.className = 'ok';
          } else {
            statusEl.textContent = res.j && res.j.error ? res.j.error : 'Something went wrong. Please try again.';
            statusEl.className = 'err';
          }
        })
        .catch(function () {
          statusEl.textContent = 'Network error — please try again.';
          statusEl.className = 'err';
        });
    });

    document.getElementById('btn-copy-key').addEventListener('click', function () {
      var self = this;
      navigator.clipboard.writeText(keyValue.textContent).then(function () {
        self.textContent = 'Copied!';
        setTimeout(function () { self.textContent = 'Copy key'; }, 1500);
      }).catch(function () {});
    });
  </script>
<script>
(function(){try{if(navigator.doNotTrack==='1')return;var p=location.pathname.replace(/\.html$/,'')||'/';document.addEventListener('click',function(ev){var a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;if(!a)return;var h=a.getAttribute('href')||'';var m=h.match(/^\/(scan|clean-copy-tool|page-profile|site-icons|text-diff|url-to-markdown|free-tools|compliance-report)(\.html)?(#[^#]*)?$/);if(!m)return;try{navigator.sendBeacon('/api/track',new Blob([JSON.stringify({path:p,event:'cta-'+m[1]})],{type:'application/json'}));}catch(e){}},true);}catch(e){}})();
</script>
<script>
(function(){try{if(navigator.doNotTrack==='1')return;var p=location.pathname.replace(/\.html$/,'')||'/';fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p}),keepalive:true}).catch(function(){});}catch(e){}})();
</script>
</body>
</html>
