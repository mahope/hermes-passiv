<a class="skip-link" href="#main">{{skip_label}}</a>
<div class="family-bar"><div class="container"><span class="family-label">{{family_label}}</span>
{{family_links}}
</div></div>
<header class="site-header">
  <div class="container bar"><a class="brand" href="{{home}}">{{brand}} <span class="brand-by">{{brand_by}}</span></a>
    <nav class="site-nav" id="site-nav" aria-label="{{nav_label}}">
{{nav}}
    </nav>
    <div class="header-tools">
      <button class="search-btn" type="button" data-search-open aria-label="{{search_label}}" aria-keyshortcuts="Control+K Meta+K /"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>{{search_label}}</span><kbd>Ctrl K</kbd></button>
{{lang_switch}}
      <button class="theme-btn" type="button" data-theme-toggle aria-label="{{theme_label}}" title="{{theme_label}}"><svg class="icon icon-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M12 4a8 8 0 0 1 0 16" fill="currentColor" stroke="none"/></svg><svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="{{menu_label}}">
        <svg class="icon icon-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="icon icon-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="search-dialog" data-search-dialog hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="{{search_label}}">
    <form action="{{search_url}}" method="get" role="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" name="q" autocomplete="off" spellcheck="false" placeholder="{{search_placeholder}}" aria-label="{{search_label}}"><button type="button" class="search-close" data-search-close>Esc</button></form>
    <ol class="search-results" data-search-results aria-live="polite"><li class="hint">{{search_hint}}</li></ol>
    <div class="search-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> {{search_nav}}</span><span><kbd>↵</kbd> {{search_open}}</span><span><kbd>Esc</kbd> {{search_close}}</span></div>
  </div>
</div>
