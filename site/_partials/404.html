<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="robots" content="noindex">
<meta name="description" content="{{description}}">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="main">
  <section class="not-found">
    <div class="container">
      <p class="code">404</p>
      <h1>{{heading}}</h1>
      <p class="subtitle">{{body}}</p>
      <form action="{{search_url}}" method="get" role="search"><input type="search" name="q" placeholder="{{search_placeholder}}" aria-label="{{search_label}}"><button type="submit" class="btn-primary">{{search_label}}</button></form>
      <ul>
{{links}}
      </ul>
    </div>
  </section>
</main>
</body>
</html>
